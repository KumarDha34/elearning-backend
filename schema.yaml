  /api/v1/academics/schools/:
    get:
      operationId: schools_list
      description: Get a paginated list of schools with optional filters
      summary: List Schools
      parameters:
      - in: query
        name: is_verified
        schema:
          type: boolean
        description: Filter by verification status
      - in: query
        name: school_type
        schema:
          type: string
        description: Filter by school type (School, College, University)
      - in: query
        name: search
        schema:
          type: string
        description: Search by name
      tags:
      - academics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'
          description: ''
        '400':
          description: Invalid filter parameters
    post:
      operationId: schools_create
      description: Create a new school. Only admins can create schools. New schools
        are automatically verified.
      summary: Create School (Admin only)
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRequest'
            examples:
              CreateSchoolExample:
                value:
                  name: Kathmandu Valley School
                  address: Kathmandu, Nepal
                  school_type: School
                summary: Create School Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SchoolRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SchoolRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
              examples:
                CreateSchoolExample:
                  value:
                    name: Kathmandu Valley School
                    address: Kathmandu, Nepal
                    school_type: School
                  summary: Create School Example
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied - Admin only
  /api/v1/academics/schools/{id}/:
    get:
      operationId: schools_retrieve
      description: Get detailed information about a specific school
      summary: Get School Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - academics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
          description: ''
        '404':
          description: School not found
    patch:
      operationId: schools_update
      description: Update specific fields of a school. Only admins or the school creator
        can update.
      summary: Partial Update School
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSchoolRequest'
            examples:
              UpdateSchoolExample:
                value:
                  name: Updated School Name
                  address: New Address
                  school_type: College
                  is_verified: false
                summary: Update School Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSchoolRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSchoolRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
              examples:
                UpdateSchoolExample:
                  value:
                    name: Updated School Name
                    address: New Address
                    school_type: College
                    is_verified: false
                  summary: Update School Example
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied
        '404':
          description: School not found
  /api/v1/academics/schools/{id}/verify/:
    post:
      operationId: schools_verify
      description: Mark a school as verified. Only admins can perform this action.
      summary: Verify School (Admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
