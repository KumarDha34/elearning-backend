      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - academics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassLevel'
          description: ''
        '404':
          description: Class Level not found
    patch:
      operationId: class_levels_update
      description: Update specific fields of a class level. Only admins can update
        class levels.
      summary: Partial Update Class Level (Admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClassLevelRequest'
            examples:
              UpdateClassLevelExample:
                value:
                  name: Updated Class Name
                  display_order: 13
                summary: Update Class Level Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClassLevelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClassLevelRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassLevel'
              examples:
                UpdateClassLevelExample:
                  value:
                    name: Updated Class Name
                    display_order: 13
                  summary: Update Class Level Example
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied - Admin only
        '404':
          description: Class Level not found
  /api/v1/academics/faculties/:
