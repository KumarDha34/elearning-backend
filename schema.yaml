        '404':
          description: Question not found
  /api/v1/notes/old-questions/{id}/update/:
    patch:
      operationId: old_question_update
      description: "\n        Update a question paper.\n        \n        **Rules:**\n\
        \        1. Only the teacher who created it can update\n        2. Only 'pending'\
        \ questions can be updated\n        3. Partial updates allowed (send only\
        \ fields to change)\n        \n        **Cannot update:**\n        - Published\
        \ questions (already approved)\n        - Rejected questions (must resubmit)\n\
        \        "
      summary: Update Old Question
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOldQuestionUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOldQuestionUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOldQuestionUpdateRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OldQuestionDetail'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied
        '404':
          description: Question not found
  /api/v1/notes/old-questions/create/:
    post:
      operationId: old_question_create
      description: "\n        Upload a past question paper.\n        \n        **Requirements:**\n\
        \        - Only verified teachers or Admin can upload\n        - Status automatically\
        \ set to 'pending'\n        - CKEditor content required (min 10 characters)\n\
        \        \n        **Workflow:**\n        1. Teacher uploads → status = 'pending'\n\
        \        2. Admin reviews and approves/rejects\n        "
      summary: Upload Old Question
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OldQuestionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OldQuestionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OldQuestionCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OldQuestionDetail'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied
  /api/v1/notes/old-questions/my-questions/:
    get:
      operationId: old_question_my
      description: "\n        Get all old questions uploaded by the current teacher.\n\
        \        \n        **Access:** Teachers only\n        \n        **Includes:**\
        \ All statuses (pending, published, rejected)\n        **Order:** Latest first\
        \ (by exam year and creation date)\n        "
      summary: My Old Questions
      tags:
      - notes
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OldQuestionList'
          description: ''
        '403':
          description: Permission denied (Teachers only)
  /api/v1/notes/preview/:
    post:
      operationId: notes_preview
      description: Preview note content before saving. Only verified teachers or Admin
        can preview.
      summary: Preview Note (Verified Teachers or Admin Only)
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotePreviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotePreviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotePreviewRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: Preview generated successfully
        '400':
          description: Validation error
        '403':
          description: Permission denied
