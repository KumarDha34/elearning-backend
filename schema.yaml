      description: Create a new subject. Only admins can create subjects.
      summary: Create Subject (Admin only)
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectRequest'
            examples:
              CreateSubjectExample:
                value:
                  name: Mathematics
                  faculty: 1
                  class_level: 1
                summary: Create Subject Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubjectRequest'
