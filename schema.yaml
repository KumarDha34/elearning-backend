      tags:
      - academics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'
          description: ''
        '401':
          description: Authentication required
  /api/v1/academics/subjects/:
    get:
      operationId: subjects_list
      description: Get a list of all subjects with optional filters
      summary: List Subjects
      parameters:
      - in: query
        name: class_level
        schema:
          type: integer
        description: Filter by class level ID
      - in: query
        name: faculty
        schema:
          type: integer
        description: Filter by faculty ID
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by active status
      - in: query
        name: search
        schema:
          type: string
        description: Search by name
      tags:
      - academics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
