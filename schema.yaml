openapi: 3.0.3
info:
  title: E-Learning Platform for Nepal — API
  version: 1.0.0
  description: Complete Module API
paths:
  /api/v1/academics/chapters/:
    get:
      operationId: chapters_list
      description: Get a list of all chapter with filters
      summary: List Chapters
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by active status
      - in: query
        name: search
        schema:
          type: string
        description: Search by name
      - in: query
        name: subject
        schema:
          type: integer
        description: Filter by subject ID
      tags:
      - academics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'
          description: ''
    post:
      operationId: create_chapters
      description: Create a new Chapter. Only Admins can create
      summary: Create Chapters
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChapterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChapterRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied - Admin only
  /api/v1/academics/chapters/{id}/:
    get:
      operationId: chapters_retrieve
      description: Get detailed information about a specific chapter
      summary: Get Chapter Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - academics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
          description: ''
        '404':
          description: Chapter not found
    patch:
      operationId: chapters_update
      description: Update specific fields of a chapter. Only admins can update chapters.
      summary: Partial Update Chapter (Admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChapterRequest'
            examples:
              UpdateChapterExample:
                value:
                  name: Updated Chapter Name
                  description: Updated description
                  is_active: false
                summary: Update Chapter Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChapterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChapterRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
              examples:
                UpdateChapterExample:
                  value:
                    name: Updated Chapter Name
                    description: Updated description
                    is_active: false
                  summary: Update Chapter Example
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied - Admin only
        '404':
          description: Chapter not found
    delete:
      operationId: chapters_delete
      description: Delete a chapter. Only admins can delete chapters.
      summary: Delete Chapter (Admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - academics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: Permission denied - Admin only
        '404':
          description: Chapter not found
  /api/v1/academics/class-levels/:
    get:
      operationId: class_levels_list
      description: Get a list of all class levels with optional filters
      summary: List Class Levels
      parameters:
      - in: query
        name: level_type
        schema:
          type: string
        description: Filter by level type (SEE, +2, bachelor)
      - in: query
        name: search
        schema:
          type: string
        description: Search by name
      tags:
      - academics
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassLevel'
          description: ''
    post:
      operationId: class_levels_create
      description: Create a new class level. Only admins can create class levels.
      summary: Create Class Level (Admin only)
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassLevelRequest'
            examples:
              CreateClassLevelExample:
                value:
                  name: Grade 12
                  level_type: '+2'
                  display_order: 12
                summary: Create Class Level Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClassLevelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassLevelRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassLevel'
              examples:
                CreateClassLevelExample:
                  value:
                    name: Grade 12
                    level_type: '+2'
                    display_order: 12
                  summary: Create Class Level Example
          description: ''
        '400':
          description: Validation error
        '403':
          description: Permission denied - Admin only
  /api/v1/academics/class-levels/{id}/:
    get:
      operationId: class_levels_retrieve
      description: Get detailed information about a specific class level
