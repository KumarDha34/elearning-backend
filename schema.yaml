  /api/v1/auth/admin/teachers/{phone_number}/verify/:
    patch:
      operationId: auth_admin_teachers_verify_partial_update
      description: |-
        PATCH /api/v1/auth/admin/teachers/{phone_number}/verify/
        Admin can verify or unverify a teacher
      parameters:
      - in: path
        name: phone_number
        schema:
          type: string
        description: Phone number of the teacher (10 digits)
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminVerifyTeacherRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminVerifyTeacherRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminVerifyTeacherRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/admin/users/:
    get:
      operationId: auth_admin_users_list
      description: List all users (Admin only)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/v1/auth/admin/users/{phone_number}/:
    patch:
      operationId: auth_admin_users_partial_update
      description: |-
        PATCH /api/v1/auth/admin/users/{phone_number}/
        Activate or Deactivate a user by phone number (Admin only)
        Can also update role to student/instructor/editor
      parameters:
      - in: path
        name: phone_number
        schema:
          type: string
        description: Phone number of the user (10 digits)
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/admin/users/create/:
    post:
      operationId: auth_admin_users_create_create
      description: Create editor user (Admin only)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          multipart/form-data:
            schema:
